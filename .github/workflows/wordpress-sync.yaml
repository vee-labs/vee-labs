name: Sync Docs to WordPress.com

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/sync_wordpress.py'
      - '.github/workflows/wordpress-sync.yaml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install markdown

      - name: Sync to WordPress.com
        env:
          WP_ACCESS_TOKEN: ${{ secrets.WP_ACCESS_TOKEN }}
          WP_SITE: veelabs1.wordpress.com
        run: python scripts/sync_wordpress.py
